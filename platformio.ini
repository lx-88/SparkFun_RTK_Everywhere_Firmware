; PlatformIO Project Configuration File for SparkFun RTK Everywhere Firmware
;
; This configuration enables building the RTK firmware using PlatformIO
; as an alternative to the Arduino CLI + Makefile build system.
;
; IMPORTANT: This uses the pioarduino fork of platform-espressif32 because
; the official PlatformIO espressif32 platform does not yet support Arduino
; ESP32 Core 3.x. The pioarduino fork provides Arduino ESP32 3.0.4+ support.
;
; Build commands:
;   pio run                 - Build firmware
;   pio run -t upload       - Upload to device
;   pio run -t monitor      - Open serial monitor
;   pio run -t clean        - Clean build files
;
; Important setup steps before building:
;   1. Apply library patches: cd Firmware/RTK_Everywhere && make patch
;   2. Update web UI: python ../Tools/index_html_zipper.py AP-Config/index.html form.h
;   3. Update JS: python ../Tools/main_js_zipper.py AP-Config/src/main.js form.h

[platformio]
; Main source directory containing RTK_Everywhere.ino
src_dir = Firmware/RTK_Everywhere
; Default environment to build
default_envs = rtk_torch

[env]
; Common settings for all environments
; Using pioarduino fork for Arduino ESP32 3.x support (equivalent to Arduino ESP32 Core 3.0.7)
; See: https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
; Reduce IRAM usage
build_type = release
; Use 16MB variant with different memory layout
board_upload.flash_size = 16MB

; Upload settings
upload_speed = 460800
monitor_speed = 115200

; Build settings
board_build.partitions = Firmware/RTK_Everywhere/RTKEverywhere.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.psram = enabled

; Firmware version (change these for releases)
build_flags =
    -DFIRMWARE_VERSION_MAJOR=99
    -DFIRMWARE_VERSION_MINOR=99
    -DENABLE_DEVELOPER=true
    -DPOINTPERFECT_TOKEN=""
    ; Feature compilation flags (comment out to disable features during development)
    ; Temporarily disable some features to fit in IRAM - re-enable as needed
    -DCOMPILE_BT
    -DCOMPILE_WIFI
    ; -DCOMPILE_ETHERNET
    ; -DCOMPILE_CELLULAR
    -DCOMPILE_AUTHENTICATION
    -DCOMPILE_AP
    ; -DCOMPILE_ESPNOW
    ; -DCOMPILE_L_BAND
    -DCOMPILE_POINTPERFECT_LIBRARY
    ; -DCOMPILE_MQTT_CLIENT
    -DCOMPILE_OTA_AUTO
    -DCOMPILE_HTTP_CLIENT
    ; ESP32 configuration
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; PSRAM cache fix with memory barrier strategy (same as Arduino CLI)
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    ; Optimize for size to reduce IRAM usage
    -Os
    ; Reduce WiFi and BT IRAM usage
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BTDM_CTRL_HLI=0
    -DCONFIG_WIFI_IRAM_OPT=0
    -DCONFIG_WIFI_RX_IRAM_OPT=0
    ; Arduino ESP32 settings (matching Arduino CLI exactly)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    ; Fix for library include path issues with pioarduino platform
    ; Using absolute paths since PlatformIO variables don't expand properly
    -I/Users/michaelewald/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
    -I/Users/michaelewald/.platformio/packages/framework-arduinoespressif32/libraries/Wire/src
    -I/Users/michaelewald/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src
    -I/Users/michaelewald/.platformio/packages/framework-arduinoespressif32/libraries/FS/src

; Library dependency finder mode
; Use 'chain+' for more thorough dependency resolution
lib_ldf_mode = chain+

; Pre-build script to apply firmware patches (NetworkEvents, etc.)
; Also adds Arduino CLI build tasks
extra_scripts =
    pre:scripts/pre_extra_script.py
    scripts/makefile_tasks.py

; Exclude the Patch directory from being compiled as source code
; The patch script will copy these files to the framework directories instead
build_src_filter = +<*> -<Patch/>

; Required Arduino libraries
; Note: Many libraries use GitHub URLs because PlatformIO registry may have
; issues finding specific versions or packages on darwin_arm64
lib_deps =
    Wire
    SPI
    Networking
    WiFi
    BLE
    bblanchon/ArduinoJson @ 7.0.4
    arduino-libraries/ArduinoMqttClient @ 0.1.8
    avinabmalla/ESP32_BleSerial @ 2.0.1
    ; ESP32-OTA-Pull - from GitHub
    https://github.com/mikalhart/ESP32-OTA-Pull.git
    fbiego/ESP32Time @ 2.0.0
    JChristensen/JC_Button @ 2.1.2
    knolleary/PubSubClient @ 2.8.0
    ; SdFat - from GitHub
    https://github.com/greiman/SdFat.git#2.1.1
    ; SparkFun libraries - using GitHub URLs for better compatibility
    https://github.com/sparkfun/SparkFun_BQ40Z50_Battery_Manager_Arduino_Library.git#v1.0.0
    https://github.com/sparkfun/SparkFun_Extensible_Message_Parser.git#v1.0.4
    https://github.com/sparkfun/SparkFun_I2C_Expander_Arduino_Library.git#v1.0.1
    https://github.com/sparkfun/SparkFun_IM19_IMU_Arduino_Library.git#v1.0.1
    https://github.com/sparkfun/SparkFun_LG290P_GNSS_Arduino_Library.git#v1.0.8
    https://github.com/sparkfun/SparkFun_LIS2DH12_Arduino_Library.git#v1.0.3
    https://github.com/sparkfun/SparkFun_MAX1704x_Fuel_Gauge_Arduino_Library.git#v1.0.4
    https://github.com/sparkfun/SparkFun_Qwiic_OLED_Arduino_Library.git#v1.0.13
    https://github.com/sparkfun/SparkFun_u-blox_GNSS_v3.git#v3.1.10
    https://github.com/sparkfun/SparkFun_u-blox_PointPerfect_Library.git#v1.11.4
    https://github.com/sparkfun/SparkFun_Unicore_GNSS_Arduino_Library.git#v1.0.5
    https://github.com/sparkfun/SparkFun_Apple_Accessory_Arduino_Library.git#v3.0.9
    https://github.com/sparkfun/SparkFun_ATECCX08a_Arduino_Library.git#v1.0.0
    https://github.com/sparkfun/SparkFun_Toolkit.git#v1.0.6
    ; SSLClient - Using govorox fork for ESP32 3.x compatibility
    ; The original SSLClientESP32 by alkonosst doesn't support ESP32 Core 3.x
    https://github.com/govorox/SSLClient.git

; Extra build scripts (if needed in future)
; extra_scripts =
;     pre:scripts/pre_build.py
;     post:scripts/post_build.py

; ============================================================================
; Environment Definitions
; ============================================================================

; RTK Torch (default environment)
; Uses /dev/ttyACM1 on Linux, COM port on Windows
[env:rtk_torch]
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_TORCH

; RTK Torch with verbose debug output
[env:rtk_torch_debug]
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_TORCH
    -DCORE_DEBUG_LEVEL=5
build_type = debug

; RTK EVK (Evaluation Kit)
[env:rtk_evk]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_EVK

; RTK Postcard (8MB flash variant)
; Uses different partition table
[env:rtk_postcard]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.partitions = RTKEverywhere_8MB.csv
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_POSTCARD

; RTK Facet mosaic
[env:rtk_facet_mosaic]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_FACET_MOSAIC

; Release build (minimal debug, for production)
; Change firmware version numbers before building release
[env:rtk_torch_release]
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_type = release
build_flags =
    ${env.build_flags}
    -DPRODUCT_VARIANT=RTK_TORCH
    -DFIRMWARE_VERSION_MAJOR=2
    -DFIRMWARE_VERSION_MINOR=3
    -DENABLE_DEVELOPER=false
    -DCORE_DEBUG_LEVEL=0

; ============================================================================
; Arduino CLI Build Environment (RECOMMENDED FOR DEVELOPMENT)
; ============================================================================
; This environment uses Arduino CLI + Makefile for building.
; Why? The makefile build uses ESP-IDF 5.1 with IRAM-optimized library patches that
; allow the firmware to fit in the ESP32's 128KB IRAM. PlatformIO's pioarduino platform
; uses ESP-IDF 5.5 which is incompatible with these patches.
;
; IMPORTANT: This doesn't actually use PlatformIO to build - it's just a convenience
; wrapper around the makefile. Use the custom tasks below instead:
;
; Usage:
;   Build:    pio run -t arduino_build
;   Upload:   pio run -t arduino_upload (or: cd Firmware/RTK_Everywhere && make upload_torch)
;   Monitor:  pio device monitor -p /dev/ttyACM1 -b 115200
;   Clean:    cd Firmware/RTK_Everywhere && make clean
;
; Setup (first time only):
;   cd Firmware/RTK_Everywhere
;   make lib-update   # Install Arduino libraries
;   make patch        # Apply IRAM optimization patches
;
; Note: For native PlatformIO build (currently has IRAM overflow), use env:rtk_torch
